<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Change Password — Elevated Ink Tattoo Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<style>
  :root{
    --paper:#17130e; --paper-alt:#221c14; --ink:#ece0c3; --ink-soft:#b9ab8c;
    --red:#c14a3a; --red-bright:#d65b46; --green:#2f7d55; --gold:#d4a94f; --line:#443a2c; --max:1180px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background-color:var(--paper); color:var(--ink); font-family:'Libre Franklin',sans-serif; font-size:16px; line-height:1.6;
    background-image:url('logo-watermark.png'); background-repeat:no-repeat; background-position:center center;
    background-attachment:fixed; background-size:min(85vw, 1000px) auto;
  }
  a{color:inherit;}
  img{max-width:100%; display:block;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 28px;}
  h1,h2,h3{margin:0; font-family:'Alfa Slab One',serif; font-weight:400; line-height:1.1;}
  h2{font-size:clamp(28px,3.6vw,40px);}

  header{position:sticky; top:0; z-index:50; background:var(--paper); border-bottom:3px solid var(--ink);}
  nav.wrap{display:flex; align-items:center; justify-content:space-between; height:76px;}
  .brand-logo{height:46px; width:auto; display:block;}
  .nav-links{display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; align-items:center;}
  .back-link{font-weight:600; font-size:13px; color:var(--ink-soft); text-decoration:none; border:2px solid var(--line); padding:8px 14px; transition:all .2s;}
  .back-link:hover{color:var(--ink); border-color:var(--ink);}

  section{padding:60px 0 80px;}
  .sec-head{margin-bottom:30px; max-width:640px;}
  .sec-head p{color:var(--ink-soft); font-size:15px; margin:8px 0 0;}

  .btn{font-family:inherit; font-weight:700; font-size:14px; padding:12px 22px; text-decoration:none; display:inline-block; transition:all .2s; cursor:pointer; border:2px solid var(--ink);}
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{background:var(--red); border-color:var(--red); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--ink);}
  .btn-ghost:hover{background:var(--ink); color:var(--paper);}
  .btn-danger{background:transparent; border-color:var(--red); color:var(--red-bright);}
  .btn-danger:hover{background:var(--red); color:var(--ink);}
  .btn[disabled]{opacity:.55; cursor:not-allowed;}
  .btn-sm{padding:7px 12px; font-size:12px;}

  .shell{border:2px solid var(--ink); background:var(--paper-alt); padding:32px;}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px;}
  .field label{display:block; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.02em; color:var(--ink-soft); margin-bottom:7px;}
  .field input[type=email], .field input[type=password], .field input[type=text]{
    width:100%; padding:12px 14px; font:inherit; background:var(--paper); color:var(--ink); border:2px solid var(--line);
  }
  .field input:focus{outline:none; border-color:var(--red);}
  .msg{min-height:22px; font-size:14px; margin:6px 0 14px; color:var(--red-bright);}
  .msg.ok{color:#7fd4a0;}

  .bar{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:24px;}
  .bar b{color:var(--gold);}

  .upload-box{border:2px dashed var(--ink-soft); padding:22px; margin-bottom:12px; display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
  .upload-box p{margin:0; color:var(--ink-soft); font-size:14px; flex:1 1 240px;}
  #fileInput{display:none;}

  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:22px;}
  .card{border:2px solid var(--ink); background:var(--paper); display:flex; flex-direction:column;}
  .thumb{position:relative; aspect-ratio:3/4; background:#2b241a; overflow:hidden;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .badge{position:absolute; top:8px; left:8px; background:var(--gold); color:#221c14; font-size:11px; font-weight:700; padding:3px 8px; letter-spacing:.02em;}
  .cap{padding:8px 10px; font-size:12.5px; color:var(--ink-soft); min-height:34px; border-top:1px solid var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .actions{display:flex; gap:8px; padding:0 10px 10px;}
  .actions .btn{flex:1;}
  .empty{color:var(--ink-soft); padding:30px 0;}

  details.removed{margin-top:34px; border-top:1px solid var(--line); padding-top:18px;}
  details.removed summary{cursor:pointer; font-weight:600; color:var(--ink-soft);}
  .mini-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-top:16px;}
  .mini{border:2px solid var(--line); background:var(--paper);}
  .mini img{width:100%; aspect-ratio:3/4; object-fit:cover; opacity:.6;}
  .mini .btn{width:100%; border-width:0; border-top:2px solid var(--line);}

  .modal{position:fixed; inset:0; z-index:100; background:rgba(10,8,5,.82); display:none; align-items:center; justify-content:center; padding:20px;}
  .modal.open{display:flex;}
  .modal-box{background:var(--paper-alt); border:2px solid var(--ink); padding:28px; width:100%; max-width:440px;}
  .modal-box h3{font-size:22px; margin-bottom:16px;}
  .modal-box .field{margin-bottom:16px;}
  .check{display:flex; gap:10px; align-items:center; margin-bottom:20px; font-size:14px; cursor:pointer;}
  .check input{width:18px; height:18px; accent-color:var(--red);}
  .modal-actions{display:flex; gap:12px; justify-content:flex-end;}
  .modal-preview{width:100%; max-height:240px; object-fit:contain; background:#2b241a; margin-bottom:16px;}

  @media(max-width:900px){ .grid{grid-template-columns:repeat(3,1fr);} .mini-grid{grid-template-columns:repeat(4,1fr);} }
  @media(max-width:600px){
    .wrap{padding:0 16px;} .brand-logo{height:36px;}
    .shell{padding:18px;} .form-row{grid-template-columns:1fr;}
    .grid{grid-template-columns:repeat(2,1fr); gap:10px;} .mini-grid{grid-template-columns:repeat(3,1fr);}
    .actions{flex-direction:column;}
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand"><img src="logo.png" alt="Elevated Ink" class="brand-logo"></a>
    <div class="nav-links">
      <div id="artistMenu"></div>
      <a href="index.html" class="back-link">&larr; Back to site</a>
    </div>
  </nav>
</header>

<section>
  <div class="wrap">
    <div class="sec-head">
      <h2>Change Password</h2>
      <p>Choose your own password. Use at least 8 characters, and something you don't use anywhere else.</p>
    </div>

    <div class="shell" id="noSession" style="display:none;">
      <p style="margin-top:0;">You need to be signed in to change your password.</p>
      <a class="btn btn-primary" href="scheduler.html">Go to sign in</a>
    </div>

    <div class="shell" id="pwShell" style="display:none; max-width:520px;">
      <div class="field" style="margin-bottom:16px;"><label for="pw1">New password</label><input type="password" id="pw1" autocomplete="new-password"></div>
      <div class="field"><label for="pw2">Confirm new password</label><input type="password" id="pw2" autocomplete="new-password"></div>
      <div class="msg" id="pwMsg" role="status"></div>
      <button class="btn btn-primary" id="pwBtn" type="button">Save new password</button>
    </div>
  </div>
</section>

<script>
const SUPABASE_URL = "https://bvsgrgdardumiabfewwr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__Qic8J69dJyd76lnVw2m-A_OaF0R9nO";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
function say(text, ok){ $("pwMsg").textContent = text || ""; $("pwMsg").classList.toggle("ok", !!ok); }

ArtistAuth.init(sb);
ArtistAuth.mountMenu($("artistMenu"), "password");

sb.auth.getSession().then(({ data }) => {
  $(data.session ? "pwShell" : "noSession").style.display = "block";
});

$("pwBtn").addEventListener("click", async () => {
  const a = $("pw1").value, b = $("pw2").value;
  if(a.length < 8){ say("Choose a password with at least 8 characters."); return; }
  if(a !== b){ say("The two passwords don't match."); return; }
  $("pwBtn").disabled = true; say("Saving…");
  const { error } = await sb.auth.updateUser({ password: a });
  $("pwBtn").disabled = false;
  if(error){ say("Couldn't change password: " + error.message); return; }
  $("pw1").value = ""; $("pw2").value = "";
  say("Password changed. Use it next time you sign in.", true);
});
[$("pw1"), $("pw2")].forEach(i => i.addEventListener("keydown", e => { if(e.key === "Enter") $("pwBtn").click(); }));
</script>
</body>
</html>
